<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JavaScript Test</title>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    background:#f0f0f0;
    margin:0;
    padding:20px;
}

.container{
    max-width:400px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.15);
}

h2{
    text-align:center;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input{
    width:100%;
    font-size:22px;
    padding:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    margin-top:20px;
    padding:15px;
    font-size:22px;
    cursor:pointer;
}

.ergebnis{
    margin-top:20px;
    padding:15px;
    background:#e8f3ff;
    border-radius:8px;
    font-size:24px;
    text-align:center;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h2>JavaScript-Test</h2>

<label>Eingabewert</label>
<input type="number" id="eingabe" value="10">

<button onclick="berechnen()">Mal 2 rechnen</button>

<div class="ergebnis" id="ergebnis">
Ergebnis erscheint hier
</div>

</div>

<script>

function berechnen(){

    let wert = Number(document.getElementById("eingabe").value);

    let ergebnis = wert * 2;

    document.getElementById("ergebnis").innerHTML = ergebnis;

}

</script>

</body>
</html>
